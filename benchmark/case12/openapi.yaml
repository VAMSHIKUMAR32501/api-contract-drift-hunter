openapi: 3.0.0

info:
  title: Rating API
  version: 1.0.0

paths:
  /ratings:
    post:
      summary: Submit a rating

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5

      responses:
        "201":
          description: Rating submitted

        "400":
          description: Invalid rating