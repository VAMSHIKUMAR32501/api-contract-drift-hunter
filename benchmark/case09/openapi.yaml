openapi: 3.0.0

info:
  title: Payment API
  version: 1.0.0

paths:
  /payments:
    post:
      summary: Create a payment

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number

      responses:
        "201":
          description: Payment created

        "400":
          description: Invalid payment request
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - code
                properties:
                  error:
                    type: string
                  code:
                    type: string