openapi: 3.0.0

info:
  title: Product Search API
  version: 1.0.0

paths:
  /products:
    get:
      summary: Search products
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                  products:
                    type: array
                    items:
                      type: string