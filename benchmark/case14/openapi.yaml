openapi: 3.0.0

info:
  title: Profile API
  version: 1.0.0

paths:
  /profiles:
    post:
      summary: Create a profile

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 20

      responses:
        "201":
          description: Profile created

        "400":
          description: Invalid username