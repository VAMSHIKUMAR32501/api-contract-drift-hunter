openapi: 3.0.0

info:
  title: User API
  version: 1.0.0

paths:
  /users/{id}:
    get:
      summary: Get a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - age
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  age:
                    type: integer